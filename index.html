    <script>
      // Keep the shared loader to one appearance per browser session. The
      // session flag survives reloads and same-tab page changes, but resets
      // naturally when the browser session ends.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          if (window.sessionStorage.getItem('av-loader-seen-v1') === '1') {
            root.classList.add('av-loader-seen');
          } else {
            window.sessionStorage.setItem('av-loader-seen-v1', '1');
          }
        } catch (error) {}
        window.setTimeout(function () {
          root.classList.add('reveal-failsafe');
        }, 3400);
      })();
    </script>

    <script>
      (function () {
        'use strict';
        var d = document.documentElement;
        var loader = document.getElementById('avLoader');
        if (!loader) return;
        if (d.classList.contains('av-loader-seen')) {
          d.classList.add('av-done');
          loader.remove();
          return;
        }
        d.classList.add('av-loading');
        var words = loader.querySelectorAll('.av-j');
        var reduced = false;
        try {
          reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (error) {}
        var done = false;
        function complete() {
          if (done) return;
          done = true;
          d.classList.add('av-done');
          d.classList.remove('av-loading');
          setTimeout(function () {
            var current = document.getElementById('avLoader');
            if (current) current.remove();
          }, 750);
        }
        if (reduced) {
          loader.classList.add('is-merge');
          setTimeout(complete, 450);
        } else {
          words.forEach(function (word, index) {
            setTimeout(function () { word.classList.add('is-in'); }, 120 + index * 60);
          });
          setTimeout(function () { loader.classList.add('is-merge'); }, 720);
          setTimeout(complete, 1450);
        }
        setTimeout(complete, 3500);
      })();
    </script>
