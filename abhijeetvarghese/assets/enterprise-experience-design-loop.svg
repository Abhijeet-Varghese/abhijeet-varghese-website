<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The Enterprise Experience Loop</title><desc id="desc">Strategy, Experience, Design, Content and Technology connect through continuous feedback rather than a single sequential handoff.</desc>
  <defs>
    <style>
      .bg{fill:#F4F0E8}.line{stroke:#C9C4BA;stroke-width:1.4;fill:none}.line2{stroke:#A8442F;stroke-width:2.2;fill:none}.dash{stroke:#C9C4BA;stroke-width:1.4;fill:none;stroke-dasharray:5 7}.panel{fill:#FCFAF5;stroke:#C9C4BA;stroke-width:1.3}.panel2{fill:#F1DDD6;stroke:#A8442F;stroke-width:1.3}.dark{fill:#0B1428}.accent{fill:#A8442F}.warm{fill:#C98B42}.text{fill:#0C1830;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;letter-spacing:1.3px}.label{fill:#5E6571;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px}.small{fill:#5E6571;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:500}.white{fill:#F8F3EB;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;letter-spacing:1.3px}.num{fill:#A8442F;font-family:Georgia,serif;font-size:31px;font-style:italic}
    </style>
    <linearGradient id="soft" x1="0" x2="1"><stop stop-color="#A8442F" stop-opacity=".16"/><stop offset="1" stop-color="#A8442F" stop-opacity="0"/></linearGradient>
  </defs>
  <rect class="bg" width="1200" height="720"/>

<text x="72" y="72" class="label">THE ENTERPRISE EXPERIENCE LOOP</text><text x="72" y="102" class="small">Continuous connection avoids expensive late-stage discoveries.</text>
<path d="M150 360 C260 177 420 177 510 360S760 543 870 360 1050 177 1062 360" fill="none" stroke="#A8442F" stroke-width="3"/>
<path d="M150 360 C264 543 420 543 510 360S760 177 870 360 1048 543 1062 360" fill="none" stroke="#C9C4BA" stroke-width="3"/>
<g><circle class="panel" cx="150" cy="360" r="76"/><text x="104" y="365" class="text">STRATEGY</text><circle class="dark" cx="350" cy="210" r="82"/><text x="293" y="215" class="white">EXPERIENCE</text><circle class="panel2" cx="510" cy="360" r="82"/><text x="468" y="365" class="text">DESIGN</text><circle class="dark" cx="710" cy="510" r="76"/><text x="670" y="515" class="white">CONTENT</text><circle class="panel" cx="870" cy="360" r="88"/><text x="818" y="365" class="text">TECHNOLOGY</text></g>
<text x="72" y="650" class="small">Instead of strategy → design → technology → content → QA, keep a shared experience point of view in the loop.</text>
</svg>