<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Approval Room versus Experience</title><desc id="desc">Approval concerns of features, budget, compliance, brand and feasibility are contrasted with the user experience needs of clarity, context, ease, confidence, relevance and meaning.</desc>
  <defs>
    <style>
      .bg{fill:#F4F0E8}.line{stroke:#C9C4BA;stroke-width:1.4;fill:none}.line2{stroke:#A8442F;stroke-width:2.2;fill:none}.dash{stroke:#C9C4BA;stroke-width:1.4;fill:none;stroke-dasharray:5 7}.panel{fill:#FCFAF5;stroke:#C9C4BA;stroke-width:1.3}.panel2{fill:#F1DDD6;stroke:#A8442F;stroke-width:1.3}.dark{fill:#0B1428}.accent{fill:#A8442F}.warm{fill:#C98B42}.text{fill:#0C1830;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;letter-spacing:1.3px}.label{fill:#5E6571;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px}.small{fill:#5E6571;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:500}.white{fill:#F8F3EB;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;letter-spacing:1.3px}.num{fill:#A8442F;font-family:Georgia,serif;font-size:31px;font-style:italic}
    </style>
    <linearGradient id="soft" x1="0" x2="1"><stop stop-color="#A8442F" stop-opacity=".16"/><stop offset="1" stop-color="#A8442F" stop-opacity="0"/></linearGradient>
  </defs>
  <rect class="bg" width="1200" height="720"/>

<text x="72" y="72" class="label">THE APPROVAL ROOM AND THE EXPERIENCE ANSWER DIFFERENT QUESTIONS</text>
<rect class="dark" x="72" y="136" width="488" height="460" rx="4"/><rect class="panel" x="640" y="136" width="488" height="460" rx="4"/>
<text x="110" y="191" class="label" fill="#D8B4A9">APPROVAL ROOM</text><text x="110" y="236" class="white">What does the</text><text x="110" y="265" class="white">organisation need to see?</text>
<g fill="#C7D0E0" font-family="Arial" font-size="16"><text x="110" y="345">Features</text><text x="110" y="390">Compliance</text><text x="110" y="435">Brand</text><text x="110" y="480">Budget</text><text x="110" y="525">Technical feasibility</text></g>
<text x="680" y="191" class="label">THE EXPERIENCE</text><text x="680" y="236" class="text">What does the person</text><text x="680" y="265" class="text">need to understand?</text>
<g fill="#0C1830" font-family="Arial" font-size="16"><text x="680" y="345">Clarity</text><text x="680" y="390">Context</text><text x="680" y="435">Ease</text><text x="680" y="480">Confidence</text><text x="680" y="525">Relevance + meaning</text></g>
<text x="582" y="364" class="num">vs</text><text x="72" y="662" class="small">Both matter. A successful enterprise project must survive both—without confusing them.</text>
</svg>