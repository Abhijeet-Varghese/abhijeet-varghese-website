<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The Two-Sided Experience</title><desc id="desc">A frontstage layer visible to an audience and backstage operations layer combine into one sustained enterprise experience.</desc>
  <defs>
    <style>
      .bg{fill:#F4F0E8}.line{stroke:#C9C4BA;stroke-width:1.4;fill:none}.line2{stroke:#A8442F;stroke-width:2.2;fill:none}.dash{stroke:#C9C4BA;stroke-width:1.4;fill:none;stroke-dasharray:5 7}.panel{fill:#FCFAF5;stroke:#C9C4BA;stroke-width:1.3}.panel2{fill:#F1DDD6;stroke:#A8442F;stroke-width:1.3}.dark{fill:#0B1428}.accent{fill:#A8442F}.warm{fill:#C98B42}.text{fill:#0C1830;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;letter-spacing:1.3px}.label{fill:#5E6571;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px}.small{fill:#5E6571;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:500}.white{fill:#F8F3EB;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;letter-spacing:1.3px}.num{fill:#A8442F;font-family:Georgia,serif;font-size:31px;font-style:italic}
    </style>
    <linearGradient id="soft" x1="0" x2="1"><stop stop-color="#A8442F" stop-opacity=".16"/><stop offset="1" stop-color="#A8442F" stop-opacity="0"/></linearGradient>
  </defs>
  <rect class="bg" width="1200" height="720"/>

<text x="72" y="72" class="label">THE TWO-SIDED EXPERIENCE</text><text x="72" y="102" class="small">The audience should experience the frontstage. The organisation must sustain the backstage.</text>
<rect class="panel" x="72" y="146" width="1056" height="180" rx="4"/><text x="108" y="188" class="label">FRONTSTAGE · WHAT THE AUDIENCE SEES</text>
<g fill="#0C1830" font-family="Arial" font-size="16" font-weight="600"><text x="118" y="267">SPACE</text><text x="302" y="267">INTERFACE</text><text x="507" y="267">STORY</text><text x="670" y="267">INTERACTION</text><text x="914" y="267">CONTENT</text></g>
<path d="M72 365H1128" stroke="#A8442F" stroke-width="3"/><circle class="accent" cx="600" cy="365" r="44"/><text x="552" y="370" class="white">EXPERIENCE</text>
<rect class="dark" x="72" y="404" width="1056" height="180" rx="4"/><text x="108" y="446" fill="#D8B4A9" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">BACKSTAGE · WHAT MAKES IT WORK</text>
<g fill="#F8F3EB" font-family="Arial" font-size="16" font-weight="600"><text x="118" y="526">PEOPLE</text><text x="292" y="526">PROCESS</text><text x="472" y="526">CONTENT MANAGEMENT</text><text x="754" y="526">OPERATIONS</text><text x="960" y="526">GOVERNANCE</text></g>
<text x="72" y="662" class="small">One experience is not only what someone sees. It is what the organisation can continue to operate.</text>
</svg>