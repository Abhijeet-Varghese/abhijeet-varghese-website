name: One-time visitor email update

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Add mobile number to visitor confirmation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1
      - name: Update visitor email
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('avos-php/backend/controllers/ApiController.php')
          s = p.read_text()
          old = '''                . "Looking forward to speaking with you.\\n\\n"
                . "Best,\\n"
                . "Abhijeet Varghese\\n"'''
          new = '''                . "Looking forward to speaking with you.\\n\\n"
                . "You can also reach me directly at +91 969 408 0706.\\n\\n"
                . "Best,\\n"
                . "Abhijeet Varghese\\n"'''
          if old not in s:
              raise SystemExit('Expected visitor email text not found')
          p.write_text(s.replace(old, new, 1))
          print('Visitor mobile number added.')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avos-php/backend/controllers/ApiController.php
          git rm .github/workflows/update-visitor-mobile.yml
          git commit -m "Add mobile number to visitor confirmation"
          git push origin HEAD:staging
