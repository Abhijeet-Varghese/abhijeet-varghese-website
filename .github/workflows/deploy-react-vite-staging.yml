name: Deploy React/Vite Staging (safe)

# ============================================================================
# ACTIVE React/Vite staging pipeline — the ONLY path to Hostinger.
#
# FLOW:
#   staging-react-vite → npm ci → typecheck → Vite build (VITE_STAGING=1)
#      → validate 25 routes → secret scan → leak check
#      → assemble FLAT package (Vite build + PHP backend at branch root)
#      → force-push `hostinger`
#
# `hostinger` is the branch Hostinger's git deployment actually pulls into
# /public_html/next/ → https://next.abhijeetvarghese.com . The branch root IS
# the web root, so the package is assembled FLAT (no public_html/ wrapper) —
# exactly matching the structure Hostinger has been serving.
#
# NEVER triggers from `main`. NEVER touches `main`.
# The legacy deploy-staging.yml (main → abhijeetvarghese/ → hostinger) has been
# retired so a main push can no longer overwrite hostinger with the old frontend.
# ============================================================================

on:
  push:
    branches:
      - staging-react-vite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: react-vite-staging
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build + validate + deploy to hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Build (staging — noindex)
        env:
          VITE_STAGING: '1'
        run: npm run build
        working-directory: frontend

      - name: Staging robots (Disallow all)
        run: |
          printf 'User-agent: *\nDisallow: /\n' > frontend/dist/robots.txt

      - name: Validate routes (exactly 25)
        run: |
          COUNT=$(find frontend/dist -name '*.html' | wc -l)
          echo "html routes: $COUNT"
          test "$COUNT" -eq 25 || { echo "expected exactly 25 routes"; exit 1; }
          for f in \
            index.html story.html experience.html portfolio.html case-studies.html \
            contact.html consulting.html for-recruiters.html insights.html journal.html \
            search.html sitemap.html privacy-policy.html terms.html 404.html \
            case-study-intuitive-experiences-for-industrial-environments.html \
            case-study-immersive-solutions-for-the-indian-army.html \
            case-study-enterprise-technology-made-understandable.html \
            experience-design/orange-business-executive-briefing-center/index.html \
            essay-technology-should-feel-human.html essay-ai-isnt-replacing-creativity.html \
            essay-designing-experiences-people-remember.html essay-why-enterprise-experiences-fail.html \
            journal-what-a-year-of-ai-enabled-production-taught-me.html \
            journal-the-experience-centre-as-a-strategic-instrument.html \
            sitemap.xml robots.txt search-index.json ; do
            test -f "frontend/dist/$f" || { echo "MISSING ROUTE: $f"; exit 1; }
          done
          echo "all 25 routes present"

      - name: Secret scan
        run: |
          if grep -rInE 'sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_|sk-or-|-----BEGIN (RSA|OPENSSH|PRIVATE) KEY|client_secret|OPENROUTER|DB_PASSWORD|SMTP_PASS' frontend/dist/ ; then
            echo "SECRET DETECTED — aborting"; exit 1
          fi
          echo "secret scan clean"

      - name: No dev / leak files
        run: |
          LEAK=$(find frontend/dist -type f \( -name '*.php' -o -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name '.env*' \) | head -n1)
          test -z "$LEAK" || { echo "leak/dev file: $LEAK"; exit 1; }
          if grep -rlE '<\?php' frontend/dist --include='*.html' | head -n1 | grep -q .; then
            echo "PHP tag leaked into static HTML"; exit 1
          fi
          echo "no dev/leak files"

      - name: Assemble FLAT staging package (branch root = web root)
        run: |
          set -euo pipefail
          PKG=_deploy
          rm -rf "$PKG"
          mkdir -p "$PKG"

          # 1) React/Vite build at the branch root (the web root for /public_html/next/)
          cp -r frontend/dist/. "$PKG/"

          # 2) PHP public entry points alongside the static build
          cp -r avos-php/public_html/admin   "$PKG/"
          cp -r avos-php/public_html/api     "$PKG/"
          cp -r avos-php/public_html/install "$PKG/"
          cp    avos-php/public_html/media.php "$PKG/"

          # 3) hardened staging .htaccess (blocks .git/dotfiles/private dirs/config/sql)
          cp frontend/staging/htaccess "$PKG/.htaccess"

          # 4) PHP engine (flat; protected from direct HTTP by the .htaccess rules)
          cp -r avos-php/backend       "$PKG/"
          cp -r avos-php/includes      "$PKG/"
          cp -r avos-php/database      "$PKG/"
          cp -r avos-php/site-template "$PKG/"
          mkdir -p "$PKG/storage"                 # empty writable runtime skeleton

          # 5) hard guarantees
          test -f "$PKG/index.html"                 || { echo "no web-root index"; exit 1; }
          test -d "$PKG/assets"                     || { echo "no hashed assets"; exit 1; }
          test -d "$PKG/admin"                      || { echo "admin missing"; exit 1; }
          test -f "$PKG/api/index.php"              || { echo "api missing"; exit 1; }
          test -f "$PKG/.htaccess"                  || { echo ".htaccess missing"; exit 1; }
          test -d "$PKG/backend" && test -d "$PKG/includes" || { echo "backend/includes missing"; exit 1; }
          test ! -e "$PKG/config.local.php"         || { echo "config.local.php leaked"; exit 1; }
          test ! -d "$PKG/css" && test ! -d "$PKG/js" || { echo "legacy css/js leaked"; exit 1; }
          echo "flat package assembled (branch root = web root)"

      - name: Upload staging artifact (SFTP fallback)
        uses: actions/upload-artifact@v4
        with:
          name: staging-react-vite-package
          path: _deploy/

      - name: Publish to hostinger (the live staging branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _deploy
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "staging-react-vite deploy $(date -u +%Y%m%d%H%M%S)"
          # hostinger is the Hostinger-connected branch → next.abhijeetvarghese.com
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:hostinger
