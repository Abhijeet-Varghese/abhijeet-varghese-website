name: Deploy React/Vite Staging (safe)

# ============================================================================
# ACTIVE React/Vite staging pipeline — the ONLY path to Hostinger.
#
# FLOW:
#   staging-react-vite
#      → backend-tests  (PHP 8.3 + MariaDB → migrate → seed → Phase 3A–3F gate)
#      → npm ci → typecheck → Vite build (VITE_STAGING=1)
#      → validate 25 routes → secret scan → leak check
#      → assemble FLAT package (Vite build + PHP backend at branch root)
#      → force-push `hostinger`
#
# The deploy job `needs: backend-tests`, so a red backend can never reach
# `hostinger`. The backend suites are NOT invoked directly: they are written to
# SKIP (and exit 0) when MariaDB or the API server is missing, so calling them
# raw would produce a gate that passes when the infrastructure is broken.
# `avos-php/tests/next/ci-run.sh` enforces exit-code 0, FAIL 0, SKIP 0 and a
# minimum assertion count instead.
#
# `hostinger` is the branch Hostinger's git deployment actually pulls into
# /public_html/next/ → https://next.abhijeetvarghese.com . The branch root IS
# the web root, so the package is assembled FLAT (no public_html/ wrapper) —
# exactly matching the structure Hostinger has been serving.
#
# NEVER triggers from `main`. NEVER touches `main`.
#
# ---------------------------------------------------------------------------
# CORRECTION (verified 2026-08-22): the note previously here claimed the legacy
# `deploy-staging.yml` had been "retired so a main push can no longer overwrite
# hostinger with the old frontend". That was NOT true. Measured against the
# live repository:
#
#   main  contains ONLY .github/workflows/deploy-staging.yml  ("Build Staging
#         Website") — still ACTIVE, triggers on push→main AND workflow_dispatch,
#         and runs `git push origin deploy-tmp:hostinger --force` with no
#         backend tests, no §103 gate, no retirement analyzer and no identity
#         guard.
#
# So a push to `main` — or a click of ITS "Run workflow" button — will
# force-overwrite `hostinger` with an ungated package. Disable that workflow
# (Actions → Build Staging Website → ⋯ → Disable workflow) before relying on
# the guarantees below.
#
# MANUAL DISPATCH: this workflow already declares `workflow_dispatch`, but the
# "Run workflow" button will NOT appear for it while the file is absent from
# the repository default branch (`main`) — GitHub only surfaces that control
# for workflows present on the default branch. Until the file is added there,
# the push trigger below is the only way to start this pipeline.
# ---------------------------------------------------------------------------
# ============================================================================

on:
  push:
    branches:
      - staging-react-vite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: react-vite-staging
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Phase 3A–3F backend gate. Runs FIRST; deployment depends on it.
  #
  # Configuration is ENVIRONMENT ONLY — no config.local.php is written anywhere
  # on the runner, because AvOS\Config\Config reads env first and env wins.
  # The database password and encryption key are GENERATED per run, so no
  # credential literal exists in this file or in the repository.
  # ==========================================================================
  backend-tests:
    name: Backend tests (Phase 3A–3F)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          # Throwaway container on the job's private network. An empty root
          # password means there is no credential to hardcode; the application
          # user below gets a generated one.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      APP_ENV: staging          # debug off — the stricter of the two non-prod modes
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: avos_next_dev
      DB_USER: avos_ci
      AVOS_TEST_HOST: 127.0.0.1
      AVOS_TEST_USER: avos_ci
      AVOS_MIN_TESTS: '1150'    # current verified baseline; a shrink fails CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, xml, pdo_mysql, mysqli, fileinfo, exif, gd, imagick, zip
          coverage: none

      # Optional capabilities. The engine works without them and the Phase 3F
      # suite reports NOT AVAILABLE rather than passing — installing them here
      # means CI exercises the full image and video pipeline instead.
      - name: Install optional media capabilities (ffmpeg) + db client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg mariadb-client

      - name: Report runtime capabilities
        run: |
          php -v | head -1
          php -r 'foreach (["pdo_mysql","fileinfo","exif","gd","imagick"] as $e)
                    printf("  %-10s %s\n", $e, extension_loaded($e) ? "yes" : "NO");'
          ffmpeg -version | head -1

      # Credentials exist only for the life of this job.
      - name: Generate disposable CI credentials
        run: |
          set -euo pipefail
          echo "DB_PASS=$(openssl rand -hex 24)"        >> "$GITHUB_ENV"
          echo "AV_ENC_KEY=$(openssl rand -hex 32)"     >> "$GITHUB_ENV"
          echo "generated a throwaway DB password and encryption key"

      - name: Wait for MariaDB
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent 2>/dev/null; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB never became available"; exit 1

      - name: Create disposable databases and user
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 3306 -u root <<SQL
          CREATE DATABASE IF NOT EXISTS avos_next_dev  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE IF NOT EXISTS avos_next_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASS}';
          GRANT ALL PRIVILEGES ON avos_next_dev.*  TO '${DB_USER}'@'%';
          GRANT ALL PRIVILEGES ON avos_next_test.* TO '${DB_USER}'@'%';
          GRANT CREATE ON *.* TO '${DB_USER}'@'%';
          FLUSH PRIVILEGES;
          SQL
          echo "disposable databases created (never persisted)"

      - name: Run migrations (real migration engine, not a dump)
        run: php avos-php/cli/avos migrate

      - name: Seed system data (roles, permissions, settings)
        run: php avos-php/cli/avos seed

      - name: Validate schema against the migration files
        run: |
          set -euo pipefail
          php avos-php/cli/avos schema:validate | tee /tmp/schema.txt
          grep -qE 'missing_tables +0'  /tmp/schema.txt || { echo "missing tables";  exit 1; }
          grep -qE 'missing_columns +0' /tmp/schema.txt || { echo "missing columns"; exit 1; }
          grep -qE 'missing_indexes +0' /tmp/schema.txt || { echo "missing indexes"; exit 1; }

      - name: PHP lint (new stack)
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "LINT FAILED: $f"; FAILED=1; }
          done < <(find avos-php/app avos-php/cli avos-php/public-next avos-php/tests/next \
                        -type f \( -name '*.php' -o -name 'avos' \))
          test "$FAILED" -eq 0 || exit 1
          echo "php lint clean"

      # THE GATE. Enforces exit 0, FAIL 0, SKIP 0 and >= AVOS_MIN_TESTS.
      # No `|| true`, no `continue-on-error`.
      - name: Phase 3A–3F backend test suite
        env:
          AVOS_TEST_PASS: ${{ env.DB_PASS }}
        run: bash avos-php/tests/next/ci-run.sh

      - name: Retirement analyzer (DELETE must be 0)
        run: |
          set -euo pipefail
          python3 tools/retirement-evidence.py . | tee /tmp/retire.txt
          grep -qE '^DELETE +\(0 files' /tmp/retire.txt || { echo "analyzer wants to DELETE new runtime"; exit 1; }

      # §3: the private owner identity must never exist in backend source.
      #
      # NOTE: tools/identity-leak-guard.py only inspects CLIENT-VISIBLE file
      # types (ts/tsx/js/html/json), so pointing it at PHP directories scans
      # zero files and proves nothing. This step therefore greps the PHP source
      # directly. The private literal is never written here — the always-on
      # check is for any gmail address, and the exact-address check uses the
      # repository secret when it is configured.
      - name: Private identity check (backend source)
        env:
          AV_OWNER_EMAIL: ${{ secrets.AV_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          DIRS="avos-php/app avos-php/cli avos-php/public-next avos-php/tests/next avos-php/database/next"

          if grep -rIn --include='*.php' -E '[A-Za-z0-9._%+-]+@gmail\.com' $DIRS ; then
            echo "PRIVATE ADDRESS PATTERN IN BACKEND SOURCE — aborting"; exit 1
          fi
          echo "no personal address in backend source"

          if [ -n "${AV_OWNER_EMAIL:-}" ]; then
            if grep -rIFq "$AV_OWNER_EMAIL" $DIRS ; then
              echo "CONFIGURED OWNER ADDRESS FOUND IN BACKEND SOURCE — aborting"; exit 1
            fi
            echo "configured owner address absent from backend source"
          else
            echo "AV_OWNER_EMAIL secret is not set — exact-address check skipped (pattern check still ran)"
          fi

          # The public address is allowed, but only as a default — never a
          # committed private one.
          echo "public address occurrences (allowed): $(grep -rIl 'hi@abhijeetvarghese.com' $DIRS 2>/dev/null | wc -l)"

      - name: Drop disposable databases
        if: always()
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root \
            -e "DROP DATABASE IF EXISTS avos_next_dev; DROP DATABASE IF EXISTS avos_next_test;" || true
          echo "test databases dropped — nothing persisted"

  build-and-package:
    name: Build + validate + deploy to hostinger
    runs-on: ubuntu-latest
    # A red backend can never reach the deployment package or `hostinger`.
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Build (staging — noindex)
        env:
          VITE_STAGING: '1'
        run: npm run build
        working-directory: frontend

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build React admin (production)
        run: npm run build
        working-directory: admin

      - name: Verify React admin build
        run: |
          test -f admin/dist/index.html || { echo "admin build missing index.html"; exit 1; }
          test -d admin/dist/assets || { echo "admin build missing assets"; exit 1; }
          grep -q '/os/assets/' admin/dist/index.html || { echo "admin base path (/os/) not applied"; exit 1; }
          echo "React admin build present (base /os/)"

      - name: Staging robots (Disallow all)
        run: |
          printf 'User-agent: *\nDisallow: /\n' > frontend/dist/robots.txt

      - name: Validate routes (registry-driven, clean URLs)
        run: |
          set -euo pipefail
          EXPECTED=$(node -e "console.log(require('./src/routes/routes.json').length)")
          FOUND=$(find dist -name '*.html' | wc -l)
          echo "registry routes: $EXPECTED · emitted html: $FOUND"
          test "$FOUND" -eq "$EXPECTED" || { echo "route count mismatch"; exit 1; }
          node -e "
            const fs=require('fs');
            for (const r of require('./src/routes/routes.json')) {
              if (!fs.existsSync('dist/'+r.out)) { console.error('MISSING ROUTE: '+r.out); process.exit(1); }
            }
            console.log('all registry routes emitted');
          "
          for f in sitemap.xml robots.txt search-index.json; do
            test -f "dist/$f" || { echo "MISSING: $f"; exit 1; }
          done
        working-directory: frontend

      # §103 acceptance: hard build failure on ANY extension URL, broken
      # internal link, duplicate canonical or dirty sitemap entry.
      - name: URL acceptance — static (§103)
        run: npm run verify:urls
        working-directory: frontend

      # §103 acceptance: runtime behaviour of the generated rewrite rules —
      # clean URLs 200, legacy URLs 301, trailing slash 301, unknown 404.
      - name: URL acceptance — runtime (§103)
        run: python3 scripts/acceptance-urls.py dist
        working-directory: frontend

      # §3: the private owner identity must never reach a client artifact.
      # AV_OWNER_EMAIL is a repository secret; the literal is never in the repo.
      - name: Identity leak guard (private email)
        env:
          AV_OWNER_EMAIL: ${{ secrets.AV_OWNER_EMAIL }}
        run: python3 tools/identity-leak-guard.py frontend/dist admin/dist avos-php/public_html

      - name: Secret scan (frontend + admin)
        run: |
          if grep -rInE 'sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_|sk-or-|-----BEGIN (RSA|OPENSSH|PRIVATE) KEY|client_secret|OPENROUTER|DB_PASSWORD|SMTP_PASS' frontend/dist/ admin/dist/ ; then
            echo "SECRET DETECTED — aborting"; exit 1
          fi
          echo "secret scan clean"

      - name: No dev / leak files (frontend + admin)
        run: |
          LEAK=$(find frontend/dist admin/dist -type f \( -name '*.php' -o -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name '.env*' \) | head -n1)
          test -z "$LEAK" || { echo "leak/dev file: $LEAK"; exit 1; }
          if grep -rlE '<\?php' frontend/dist admin/dist --include='*.html' | head -n1 | grep -q .; then
            echo "PHP tag leaked into static HTML"; exit 1
          fi
          echo "no dev/leak files"

      - name: Assemble FLAT staging package (branch root = web root)
        run: |
          set -euo pipefail
          PKG=_deploy
          rm -rf "$PKG"
          mkdir -p "$PKG"

          # 1) React/Vite build at the branch root (the web root for /public_html/next/)
          cp -r frontend/dist/. "$PKG/"

          # 1b) Next-generation React admin SPA at /os/ (legacy admin stays at /admin/)
          mkdir -p "$PKG/os"
          cp -r admin/dist/. "$PKG/os/"

          # 2) PHP public entry points alongside the static build
          cp -r avos-php/public_html/admin   "$PKG/"
          cp -r avos-php/public_html/api     "$PKG/"
          cp -r avos-php/public_html/install "$PKG/"
          cp    avos-php/public_html/media.php "$PKG/"

          # 3) hardened staging .htaccess + generated clean-URL rules (§28-31)
          cp frontend/staging/htaccess "$PKG/.htaccess"
          test -f frontend/dist/_redirects.htaccess || { echo "clean-URL rules not generated"; exit 1; }
          printf '\n' >> "$PKG/.htaccess"
          cat frontend/dist/_redirects.htaccess >> "$PKG/.htaccess"
          test -f frontend/dist/_csp.htaccess || { echo "CSP not generated"; exit 1; }
          printf '\n' >> "$PKG/.htaccess"
          cat frontend/dist/_csp.htaccess >> "$PKG/.htaccess"
          rm -f "$PKG/_redirects.htaccess" "$PKG/_csp.htaccess"   # merged, not shipped separately

          # §88: per-directory deny files must accompany every private directory
          for d in backend includes database site-template storage; do
            mkdir -p "$PKG/$d"
            cp avos-php/scripts-security/private-dir.htaccess "$PKG/$d/.htaccess"
          done

          # 4) PHP engine (flat; protected from direct HTTP by the .htaccess rules)
          cp -r avos-php/backend       "$PKG/"
          cp -r avos-php/includes      "$PKG/"
          cp -r avos-php/database      "$PKG/"
          cp -r avos-php/site-template "$PKG/"
          mkdir -p "$PKG/storage"                 # empty writable runtime skeleton

          # 4b) NEW AV OS runtime (Phase 3A-3F). Without this the new backend is
          # packaged nowhere and /api/v1/* cannot resolve on the server.
          #
          # `app/` is library code and must never be fetched directly; it gets a
          # deny file like every other private directory. The front controller is
          # mounted at api/v1/index.php, which is exactly what its own
          # dirname(__DIR__, 2) root resolution expects in a flat package.
          #
          # The legacy unversioned /api/* surface is untouched: api/index.php and
          # everything under it ship exactly as before.
          cp -r avos-php/app "$PKG/"
          cp avos-php/scripts-security/private-dir.htaccess "$PKG/app/.htaccess"
          mkdir -p "$PKG/api/v1"
          cp avos-php/public-next/api/index.php "$PKG/api/v1/index.php"
          # cli/ and tests/ are development entry points and are deliberately
          # NOT shipped.

          # 5) hard guarantees
          test -f "$PKG/index.html"                 || { echo "no web-root index"; exit 1; }
          test -d "$PKG/assets"                     || { echo "no hashed assets"; exit 1; }
          test -d "$PKG/admin"                      || { echo "admin missing"; exit 1; }
          test -f "$PKG/api/index.php"              || { echo "api missing"; exit 1; }
          test -f "$PKG/.htaccess"                  || { echo ".htaccess missing"; exit 1; }
          test -d "$PKG/backend" && test -d "$PKG/includes" || { echo "backend/includes missing"; exit 1; }
          test -f "$PKG/os/index.html"              || { echo "React admin (os/) missing"; exit 1; }
          # --- new AV OS runtime must be present and correctly wired ---------
          test -f "$PKG/app/Autoloader.php"         || { echo "new runtime app/ missing"; exit 1; }
          test -f "$PKG/app/Bootstrap/ApiKernel.php" || { echo "new runtime ApiKernel missing"; exit 1; }
          test -f "$PKG/api/v1/index.php"           || { echo "new API front controller missing"; exit 1; }
          test -f "$PKG/app/.htaccess"              || { echo "app/ deny file missing"; exit 1; }
          grep -q 'Require all denied' "$PKG/app/.htaccess" || { echo "app/ deny rule missing"; exit 1; }
          test -f "$PKG/api/index.php"              || { echo "legacy api entry lost"; exit 1; }
          grep -q 'api/v1/index.php' "$PKG/.htaccess" || { echo "/api/v1 rewrite missing"; exit 1; }
          # the front controller must resolve app/ from its mounted location
          php -r '
            $root = dirname("'"$PKG"'/api/v1", 2);
            if (!is_file($root . "/app/Autoloader.php")) { fwrite(STDERR, "front controller cannot resolve app/\n"); exit(1); }
            echo "  new API front controller resolves app/ correctly\n";
          '
          # development-only entry points must never ship
          test ! -d "$PKG/cli"                      || { echo "cli/ leaked into package"; exit 1; }
          test ! -d "$PKG/tests"                    || { echo "tests/ leaked into package"; exit 1; }
          test ! -d "$PKG/public-next"              || { echo "public-next/ leaked into package"; exit 1; }
          test -d "$PKG/os/assets"                  || { echo "React admin assets missing"; exit 1; }
          test ! -e "$PKG/config.local.php"         || { echo "config.local.php leaked"; exit 1; }
          test ! -d "$PKG/css" && test ! -d "$PKG/js" || { echo "legacy css/js leaked"; exit 1; }
          # §103: no page may ship at an extension URL (404.html is ErrorDocument-only)
          STRAY=$(find "$PKG" -maxdepth 1 -name '*.html' ! -name 'index.html' ! -name '404.html' | head -n1)
          test -z "$STRAY" || { echo "page at extension URL: $STRAY"; exit 1; }
          grep -q 'RewriteRule .*R=301' "$PKG/.htaccess" || { echo "clean-URL redirects missing from .htaccess"; exit 1; }

          # ---- §88 security acceptance on the assembled package -------------
          grep -q 'Content-Security-Policy' "$PKG/.htaccess" || { echo "CSP missing from .htaccess"; exit 1; }
          for d in backend includes database site-template storage; do
            test -f "$PKG/$d/.htaccess" || { echo "per-directory deny missing: $d"; exit 1; }
            grep -q 'Require all denied' "$PKG/$d/.htaccess" || { echo "deny rule missing: $d"; exit 1; }
          done
          test ! -e "$PKG/config.local.php" || { echo "config.local.php in package"; exit 1; }
          test ! -e "$PKG/.env" || { echo ".env in package"; exit 1; }
          test ! -d "$PKG/.git" || { echo ".git in package"; exit 1; }
          BAD=$(find "$PKG" -type f \( -name '*.sql' -o -name '*.sql.gz' -o -name '*.bak' -o -name '*.log' \
                -o -name '*.map' -o -name '*.pem' -o -name '*.key' \) -not -path "$PKG/database/*" | head -n1)
          test -z "$BAD" || { echo "sensitive artefact in package: $BAD"; exit 1; }
          # no credential literals may ship in the package (§88 §2)
          if grep -rInE "getenv\('DB_PASS'\) \?: '[^']+'|getenv\('AV_ENC_KEY'\) \?: '[^']+'" "$PKG" ; then
            echo "credential literal in deployment package"; exit 1
          fi
          echo "§88 package security guarantees: OK"

      - name: Identity leak guard (deployment package)
        env:
          AV_OWNER_EMAIL: ${{ secrets.AV_OWNER_EMAIL }}
        run: |
          python3 tools/identity-leak-guard.py _deploy
          echo "flat package assembled (branch root = web root)"

      - name: Inspect deployment package
        run: |
          echo "── package top-level (branch root = web root) ──"
          ls -la _deploy | awk '{print $9}' | grep -v '^$' | sort
          echo "── React admin (/os/) ──"
          ls -la _deploy/os | awk '{print $9}' | grep -v '^$' | sort
          echo "── html route count ──"
          find _deploy -maxdepth 2 -name '*.html' | wc -l
          echo "── PHP engine dirs ──"
          for d in backend includes database site-template api admin install app api/v1; do
            test -d "_deploy/$d" && echo "  ✓ $d" || echo "  ✗ MISSING $d"
          done
          echo "── new AV OS runtime ──"
          echo "  app/ php files : $(find _deploy/app -name '*.php' | wc -l)"
          echo "  api/v1 entry   : $(test -f _deploy/api/v1/index.php && echo present || echo MISSING)"

      - name: Upload staging artifact (SFTP fallback)
        uses: actions/upload-artifact@v4
        with:
          name: staging-react-vite-package
          path: _deploy/

      - name: Publish to hostinger (the live staging branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _deploy
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "staging-react-vite deploy $(date -u +%Y%m%d%H%M%S)"
          # hostinger is the Hostinger-connected branch → next.abhijeetvarghese.com
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:hostinger
