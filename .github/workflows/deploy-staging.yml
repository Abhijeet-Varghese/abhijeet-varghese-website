name: Build Staging Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  build-staging:
    name: Prepare Hostinger Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify website source
        run: |
          test -f abhijeetvarghese/index.html
          test -f abhijeetvarghese/.htaccess
          test -d abhijeetvarghese/assets

      - name: Create deployment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git branch -D deploy-tmp 2>/dev/null || true

          git subtree split \
            --prefix=abhijeetvarghese \
            --branch=deploy-tmp

          git push origin deploy-tmp:hostinger --force
