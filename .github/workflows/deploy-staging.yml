name: Build Staging Website

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  build-staging:
    name: Prepare Hostinger Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js for the production frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify current React frontend and AV OS source
        run: |
          set -euo pipefail
          test -f index.html
          test -f src/main.tsx
          test -f src/App.tsx
          test -f vite.config.ts
          test -f abhijeetvarghese/index.html
          test -f abhijeetvarghese/.htaccess
          test -d abhijeetvarghese/assets
          test -f avos-php/router.php
          test -f avos-php/backend/config/config.php
          test -f avos-php/public_html/api/index.php
          test -d avos-php/database
          test -d avos-php/includes

      - name: Build the React/Vite production homepage
        run: |
          set -euo pipefail
          npm ci
          npm run build

          # Vite emits the React document and hashed _react bundles, while
          # publicDir preserves the legacy assets and static inner pages.
          test -f dist/index.html
          test -d dist/_react
          test -d dist/assets
          test -d dist/css
          test -d dist/js
          test -f dist/css/mobile-menu-panel.css
          grep -q 'home-react' dist/index.html
          grep -q '/_react/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html

      - name: Assemble complete staging web root
        run: |
          set -euo pipefail
          rm -rf /tmp/staging-webroot
          mkdir -p /tmp/staging-webroot

          # AV OS continues to resolve its static site directory as
          # ../abhijeetvarghese. Publish the compiled Vite tree there rather
          # than the uncompiled legacy source tree.
          rsync -a --delete \
            dist/ /tmp/staging-webroot/abhijeetvarghese/

          rsync -a --delete \
            --exclude='config.local.php' \
            --exclude='storage/cache/' \
            --exclude='storage/logs/' \
            --exclude='storage/backups/' \
            --exclude='storage/uploads/' \
            --exclude='storage/locks/' \
            --exclude='public_html/install/.installed' \
            avos-php/ /tmp/staging-webroot/avos-php/

          cat > /tmp/staging-webroot/.htaccess <<'EOF'
          Options -Indexes
          DirectoryIndex disabled

          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
          </IfModule>

          RewriteEngine On
          RewriteRule ^avos-php(?:/|$) - [F,END]
          RewriteRule ^ avos-php/router.php [END,QSA]
          EOF

          # Fail before publishing if the deployment tree is not the compiled
          # React homepage plus the existing AV OS backend.
          test -f /tmp/staging-webroot/.htaccess
          test -f /tmp/staging-webroot/abhijeetvarghese/index.html
          test -d /tmp/staging-webroot/abhijeetvarghese/_react
          test -d /tmp/staging-webroot/abhijeetvarghese/assets
          test -d /tmp/staging-webroot/abhijeetvarghese/css
          test -d /tmp/staging-webroot/abhijeetvarghese/js
          grep -q 'home-react' /tmp/staging-webroot/abhijeetvarghese/index.html
          grep -q '/_react/' /tmp/staging-webroot/abhijeetvarghese/index.html
          ! grep -q '/src/main.tsx' /tmp/staging-webroot/abhijeetvarghese/index.html
          test -f /tmp/staging-webroot/avos-php/router.php

      - name: Publish Hostinger deployment branch
        run: |
          cd /tmp/staging-webroot
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy current frontend and AV OS to staging"
          git branch -M deploy-tmp
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin deploy-tmp:hostinger --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
