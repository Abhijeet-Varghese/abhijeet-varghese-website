name: Build Staging Website

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  build-staging:
    name: Prepare Hostinger Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify React frontend, media library, infra docs and AV OS source
        run: |
          # React frontend (canonical frontend)
          test -f package.json
          test -f vite.config.js
          test -f index.html
          test -f src/main.jsx
          test -f src/data/snapshot.json
          test -f src/data/pageMeta.json
          # Media library (served at /assets/*, never bundled)
          test -d assets/logos
          test -d assets/bpcl/images
          test -f assets/logo.png
          # Static infra documents (error/offline/maintenance/sw/robots/sitemap)
          test -f static/sw.js
          test -f static/robots.txt
          test -f static/sitemap.xml
          test -f static/404.html
          test -f static/offline.html
          test -f static/css/errors-standalone.css
          # PHP backend + CMS (source of truth, unchanged)
          test -f avos-php/router.php
          test -f avos-php/backend/config/config.php
          test -f avos-php/public_html/api/index.php
          test -d avos-php/database
          test -d avos-php/includes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build React frontend (vite build + per-route SSG prerender)
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          grep -q 'hp6-name' dist/index.html   # prerendered home content present
          test -f dist/story/index.html
          test -f dist/case-studies/bharat-petroleum-corporation-limited/index.html

      - name: Assemble complete staging web root
        run: |
          rm -rf /tmp/staging-webroot
          mkdir -p /tmp/staging-webroot

          # 1) Built React frontend (all migrated routes, prerendered)
          rsync -a --delete dist/ /tmp/staging-webroot/dist/

          # 2) Media library at /assets/* (logos, case art, fonts, bpcl media)
          rsync -a --delete assets/ /tmp/staging-webroot/assets/

          # 3) Static infra documents at the web-root paths they are linked by
          rsync -a --delete static/ /tmp/staging-webroot/static/
          cp static/sw.js static/robots.txt static/sitemap.xml static/manifest.webmanifest /tmp/staging-webroot/
          cp static/offline.html static/maintenance.html /tmp/staging-webroot/
          cp static/403.html static/404.html static/500.html static/502.html static/503.html static/504.html /tmp/staging-webroot/
          mkdir -p /tmp/staging-webroot/css /tmp/staging-webroot/js
          cp static/css/errors-standalone.css /tmp/staging-webroot/css/
          cp static/js/errors.js /tmp/staging-webroot/js/

          # 4) PHP backend + CMS (secrets stay server-local)
          rsync -a --delete \
            --exclude='config.local.php' \
            --exclude='storage/cache/' \
            --exclude='storage/logs/' \
            --exclude='storage/backups/' \
            --exclude='storage/uploads/' \
            --exclude='storage/locks/' \
            --exclude='public_html/install/.installed' \
            avos-php/ /tmp/staging-webroot/avos-php/

          # Root .htaccess — full React topology:
          #   real files (media library, static infra)  → served as-is
          #   /assets/* hashed bundles present in dist  → built frontend
          #   / + every migrated route                  → prerendered React
          #   legacy .html / alias URLs                 → 301 to canonical
          #   everything else                           → AV OS router
          #     (/api, /admin, /media, /install, error pages, 404)
          cat > /tmp/staging-webroot/.htaccess <<'EOF'
          Options -Indexes
          DirectoryIndex disabled

          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
          </IfModule>

          ErrorDocument 403 /403.html
          ErrorDocument 404 /404.html
          ErrorDocument 500 /500.html
          ErrorDocument 502 /502.html
          ErrorDocument 503 /503.html
          ErrorDocument 504 /504.html

          RewriteEngine On

          # never expose backend internals
          RewriteRule ^avos-php(?:/|$) - [F,END]

          # built React assets (hashed bundles under /assets/ that exist in dist)
          RewriteCond %{REQUEST_URI} ^/assets/
          RewriteCond %{DOCUMENT_ROOT}/dist%{REQUEST_URI} -f
          RewriteRule ^ dist%{REQUEST_URI} [END]

          # real files in the web root (media library, infra docs) stream as-is
          RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
          RewriteRule ^ - [END]

          # React home page + migrated inner routes (prerendered per route)
          RewriteRule ^$ dist/index.html [END]
          RewriteRule ^index\.html$ dist/index.html [END]
          RewriteRule ^(story|experience|case-studies|case-studies/orange-business|case-studies/indian-army|case-studies/bharat-petroleum-corporation-limited|portfolio|consulting|contact|insights|insights/technology-should-feel-human|insights/ai-isnt-replacing-creativity|insights/designing-experiences-people-remember|insights/why-enterprise-experiences-fail|journal|journal-what-a-year-of-ai-enabled-production-taught-me|journal-the-experience-centre-as-a-strategic-instrument|recruiter|privacy-policy|terms|search|sitemap)/?$ dist/$1/index.html [END]

          # legacy .html forms and aliases → canonical clean URLs (301)
          RewriteRule ^(story|portfolio|contact|privacy-policy|terms|sitemap|search|experience|insights|journal|recruiter)\.html/?$ /$1/ [R=301,L,NE]
          RewriteRule ^case-studies\.html/?$ /case-studies/ [R=301,L]
          RewriteRule ^recruitment/?$ /recruiter/ [R=301,L]
          RewriteRule ^journal-what-a-year-of-ai-enabled-production-taught-me\.html/?$ /journal-what-a-year-of-ai-enabled-production-taught-me/ [R=301,L]
          RewriteRule ^journal-the-experience-centre-as-a-strategic-instrument\.html/?$ /journal-the-experience-centre-as-a-strategic-instrument/ [R=301,L]

          # static infra documents served from their legacy root paths
          RewriteRule ^(sw\.js|robots\.txt|sitemap\.xml|manifest\.webmanifest|offline\.html|maintenance\.html|40[34]\.html|50[0-4]\.html)$ static/$1 [END]
          RewriteRule ^(css|js)/(.*)$ static/$1/$2 [END]

          # everything else → AV OS router (API, admin, media, install, 404)
          RewriteRule ^ avos-php/router.php [END,QSA]
          EOF

          test -f /tmp/staging-webroot/.htaccess
          test -f /tmp/staging-webroot/dist/index.html
          test -f /tmp/staging-webroot/assets/logo.png
          test -f /tmp/staging-webroot/static/sw.js
          test -f /tmp/staging-webroot/avos-php/router.php

      - name: Publish Hostinger deployment branch
        run: |
          cd /tmp/staging-webroot
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy React frontend + media library + infra docs + AV OS to staging"
          git branch -M deploy-tmp
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin deploy-tmp:hostinger --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
